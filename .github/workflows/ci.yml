# Compila y prueba en cada push y pull request. Protege sobre todo el cálculo de nómina.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # gradlew se creó en Windows y git no lo marca como ejecutable.
      - run: chmod +x gradlew

      - name: Pruebas del dominio
        run: ./gradlew :domain:test

      - name: Compilar la app y revisar con lint
        run: ./gradlew :app:assembleDebug :app:lintDebug

      - name: Guardar reportes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            domain/build/reports/
            app/build/reports/
